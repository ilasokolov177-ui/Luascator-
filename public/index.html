<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuaScator Mobile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#e0e0f0;font-family:sans-serif;padding:16px;max-width:600px;margin:0 auto}
.container{background:#12121e;border-radius:20px;padding:24px;border:1px solid #252540}
h1{background:linear-gradient(135deg,#7b3ffc,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:26px;margin-bottom:6px}
.sub{color:#6666aa;font-size:14px;margin-bottom:20px}
textarea{width:100%;height:160px;background:#0d0d18;border:1px solid #1e1e34;border-radius:12px;color:#c8c8e8;padding:14px;font-family:monospace;font-size:14px;resize:vertical;margin-bottom:12px}
select{width:100%;background:#0d0d18;border:1px solid #252545;color:#c8c8e8;padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:14px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#7b3ffc,#5a2bc0);color:#fff;margin-bottom:12px}
.btn:disabled{opacity:0.5}
.row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.row button{flex:1;background:#1a1a2e;color:#8888bb;border:1px solid #2a2a4a;padding:8px;border-radius:8px;cursor:pointer;font-size:12px;min-width:60px}
.row button:hover{background:#222244;color:#ccccee}
.output{background:#0d0d18;border-radius:12px;border:1px solid #1a1a2e;padding:14px;min-height:100px;font-family:monospace;font-size:12px;color:#a0a0c0;white-space:pre-wrap;word-wrap:break-word;margin-top:8px}
.status{margin-top:12px;font-size:13px;color:#555577;display:flex;justify-content:space-between}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.dot.idle{background:#333355}
.dot.loading{background:#ffcc00;animation:pulse 0.8s infinite}
.dot.success{background:#44ff88}
.dot.error{background:#ff4466}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.footer{margin-top:16px;text-align:center;color:#222244;font-size:11px}
</style>
</head>
<body>
<div class="container">
<h1>⚡ LuaScator</h1>
<div class="sub">ROBLOX LUA OBFUSCATOR — by nxtzy_</div>

<select id="levelSelect">
<option value="1">🟢 Слабый (1)</option>
<option value="5">🟡 Средний (5)</option>
<option value="10">🟠 Нормальный (10)</option>
<option value="15">🔴 Сильный (15)</option>
<option value="20">💀 Ядерный (20)</option>
</select>

<textarea id="inputCode">print("Hello World")</textarea>
<button class="btn" id="obfuscateBtn">🔒 OBFUSCATE</button>

<div class="row">
<button id="clearBtn">🗑 Очистить</button>
<button id="loadExampleBtn">📂 Пример</button>
<button id="copyBtn">📋 Копировать</button>
<button id="downloadBtn">💾 Скачать</button>
</div>

<div class="output" id="output">⏳ Результат появится здесь...</div>
<div class="status">
<span><span class="dot idle" id="statusDot"></span><span id="statusText">Готов к работе</span></span>
<span id="timerDisplay">⏱ 0.00с</span>
</div>
<div class="footer">LuaScator — by nxtzy_</div>
</div>

<script>
const input=document.getElementById('inputCode');
const output=document.getElementById('output');
const btn=document.getElementById('obfuscateBtn');
const statusText=document.getElementById('statusText');
const statusDot=document.getElementById('statusDot');
const timerDisplay=document.getElementById('timerDisplay');
const levelSelect=document.getElementById('levelSelect');

function setStatus(text,type){statusText.textContent=text;statusDot.className='dot '+type}

const example='print("Hello World")';

document.getElementById('loadExampleBtn').onclick=function(){input.value=example;setStatus('Пример загружен','idle')};
document.getElementById('clearBtn').onclick=function(){input.value='';setStatus('Очищено','idle')};
document.getElementById('copyBtn').onclick=function(){
const t=output.textContent;
if(!t||t.includes('Результат')){setStatus('Нет данных','error');return}
navigator.clipboard.writeText(t).then(()=>setStatus('Скопировано!','success')).catch(()=>{const r=document.createRange();r.selectNode(output);window.getSelection().removeAllRanges();window.getSelection().addRange(r);document.execCommand('copy');setStatus('Скопировано!','success')})};
document.getElementById('downloadBtn').onclick=function(){
const t=output.textContent;
if(!t||t.includes('Результат')){setStatus('Нет данных','error');return}
const b=new Blob([t],{type:'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='obfuscated_'+Date.now()+'.lua';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);setStatus('Скачано!','success')};

function randName(){let c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';let n='';for(let i=0;i<8;i++)n+=c.charAt(Math.floor(Math.random()*c.length));return n}

// ============================================================
// 5 РЕЖИМОВ ОБФУСКАЦИИ
// ============================================================
function obfuscate(code, level){
    function rand(min, max){return Math.floor(Math.random()*(max-min+1))+min}
    
    let result = '';
    
    // ===== УРОВЕНЬ 1: СЛАБЫЙ =====
    if(level <= 1){
        result = '-- LuaScator by nxtzy_\n';
        for(let i=0;i<5;i++){
            result += 'local ' + randName() + '=' + rand(1000,99999) + ';\n';
        }
        result += '\n' + code;
        return result;
    }
    
    // ===== УРОВЕНЬ 5: СРЕДНИЙ =====
    if(level <= 5){
        let lines = code.split('\n');
        let varMap = {};
        let reserved = ['local','function','if','then','else','elseif','end','for','while','do','repeat','until','return','break','nil','true','false','and','or','not','print','string','table','math','_G','game','workspace'];
        
        for(let line of lines){
            let newLine = line;
            let words = line.split(/\b/);
            for(let w of words){
                let clean = w.trim();
                if(clean.length > 1 && !reserved.includes(clean) && !varMap[clean]){
                    let match = clean.match(/^[a-zA-Z_][a-zA-Z0-9_]*$/);
                    if(match){
                        let newName = randName();
                        varMap[clean] = newName;
                    }
                }
            }
            for(let [oldName, newName] of Object.entries(varMap)){
                newLine = newLine.split(oldName).join(newName);
            }
            result += newLine + '\n';
        }
        for(let i=0;i<10;i++){
            result += 'local ' + randName() + '=' + rand(1000,99999) + ';\n';
        }
        return result;
    }
    
    // ===== УРОВЕНЬ 10: НОРМАЛЬНЫЙ =====
    if(level <= 10){
        result += 'local function main(...)\n';
        result += 'local env = getfenv and getfenv() or getgenv and getgenv() or _ENV or _G\n';
        result += 'local str = env.string\n';
        result += 'local char = str.char\n\n';
        
        for(let i=0;i<100;i++){
            result += 'local ' + randName() + '=' + rand(1000,99999) + ';\n';
        }
        result += '\n';
        
        let printMatch = code.match(/print\s*\(\s*["']([^"']*)["']\s*\)/);
        if(printMatch){
            let text = printMatch[1];
            let chars = [];
            for(let i=0; i<text.length; i++){
                let codeChar = text.charCodeAt(i);
                let xor1 = rand(100, 500);
                let xor2 = codeChar ^ xor1;
                chars.push(`char(bit32.bxor(${xor1}, ${xor2}))`);
            }
            
            result += 'local data = {}\n';
            for(let i=0; i<chars.length; i++){
                result += `data[${i+1}] = ${chars[i]}\n`;
            }
            result += '\nlocal output = ""\n';
            result += 'local index = 1\n';
            result += 'local total = #data\n';
            result += 'while index <= total do\n';
            result += '    output = output .. data[index]\n';
            result += '    index = index + 1\n';
            result += 'end\n\n';
            
            let printChars = [];
            let printWord = 'print';
            for(let i=0; i<printWord.length; i++){
                let codeChar = printWord.charCodeAt(i);
                let xor1 = rand(100, 500);
                let xor2 = codeChar ^ xor1;
                printChars.push(`char(bit32.bxor(${xor1}, ${xor2}))`);
            }
            
            result += `env[${printChars.join(' .. ')}](output)\n`;
        } else {
            let lines = code.split('\n');
            for(let line of lines){
                result += line + '\n';
            }
        }
        result += 'end\n';
        result += 'main(...)';
        return result;
    }
    
    // ===== УРОВЕНЬ 15: СИЛЬНЫЙ =====
    if(level <= 15){
        result += 'local function A()if debug and debug.getinfo then local B=debug.getinfo(2)if B and B.source and B.source:match("Luraph")then while true do end end end if getfenv and getfenv(0)then local C=getfenv(0)if C and rawget(C,"debug")then local D=rawget(C,"debug")if D and D.getinfo then while true do end end end end end pcall(A)\n';
        result += 'local function E()local F=getfenv and getfenv(0)or _G if F then local G=getmetatable(F)if not G then G={}setmetatable(F,G)end G.__index=function(H,I)if I=="script_key"or I=="_G"then return nil end return rawget(_G,I)end G.__newindex=function(J,K,L)if K=="script_key"or K=="_G"then return end rawset(_G,K,L)end end end pcall(E)\n\n';
        
        result += 'local function main(...)\n';
        result += 'local env = getfenv and getfenv() or getgenv and getgenv() or _ENV or _G\n';
        result += 'local str = env.string\n';
        result += 'local char = str.char\n\n';
        
        for(let i=0;i<200;i++){
            result += 'local ' + randName() + '=' + rand(1000,99999) + ';\n';
        }
        result += '\n';
        
        let printMatch = code.match(/print\s*\(\s*["']([^"']*)["']\s*\)/);
        if(printMatch){
            let text = printMatch[1];
            let chars = [];
            for(let i=0; i<text.length; i++){
                let codeChar = text.charCodeAt(i);
                let xor1 = rand(200, 800);
                let xor2 = codeChar ^ xor1;
                chars.push(`char(bit32.bxor(${xor1}, ${xor2}))`);
            }
            
            result += 'local data = {}\n';
            for(let i=0; i<chars.length; i++){
                result += `data[${i+1}] = ${chars[i]}\n`;
            }
            result += '\nlocal output = ""\n';
            result += 'local index = 1\n';
            result += 'local total = #data\n';
            result += 'while index <= total do\n';
            result += '    output = output .. data[index]\n';
            result += '    index = index + 1\n';
            result += 'end\n\n';
            
            let printChars = [];
            let printWord = 'print';
            for(let i=0; i<printWord.length; i++){
                let codeChar = printWord.charCodeAt(i);
                let xor1 = rand(200, 800);
                let xor2 = codeChar ^ xor1;
                printChars.push(`char(bit32.bxor(${xor1}, ${xor2}))`);
            }
            
            result += `env[${printChars.join(' .. ')}](output)\n`;
        } else {
            let lines = code.split('\n');
            for(let line of lines){
                result += line + '\n';
            }
        }
        result += 'end\n';
        result += 'main(...)';
        return result;
    }
    
    // ===== УРОВЕНЬ 20: ЯДЕРНЫЙ (С VM И СКРЫТЫМИ ОПКОДАМИ) =====
    if(level >= 20){
        // Анти-отладка 3 слоя
        result += 'local function A()if debug and debug.getinfo then local B=debug.getinfo(2)if B and B.source and B.source:match("Luraph")then while true do end end end if getfenv and getfenv(0)then local C=getfenv(0)if C and rawget(C,"debug")then local D=rawget(C,"debug")if D and D.getinfo then while true do end end end end end pcall(A)\n';
        result += 'local function E()local F=getfenv and getfenv(0)or _G if F then local G=getmetatable(F)if not G then G={}setmetatable(F,G)end G.__index=function(H,I)if I=="script_key"or I=="_G"then return nil end return rawget(_G,I)end G.__newindex=function(J,K,L)if K=="script_key"or K=="_G"then return end rawset(_G,K,L)end end end pcall(E)\n\n';
        result += 'local function D()if type(game)~="userdata"then while true do end end if type(workspace)~="userdata"then while true do end end if type(Instance)~="table"then while true do end end end pcall(D)\n\n';
        
        // Начало main
        result += 'local function main(...)\n';
        result += 'local env = getfenv and getfenv() or getgenv and getgenv() or _ENV or _G\n';
        result += 'local str = env.string\n';
        result += 'local char = str.char\n\n';
        
        // 400 мусорных переменных
        for(let i=0;i<400;i++){
            result += 'local ' + randName() + '=' + rand(1000,99999) + ';\n';
        }
        result += '\n';
        
        let printMatch = code.match(/print\s*\(\s*["']([^"']*)["']\s*\)/);
        if(printMatch){
            let text = printMatch[1];
            
            // ===== VM С ОПКОДАМИ =====
            result += 'local VM = {}\n';
            result += 'VM.__index = VM\n\n';
            result += 'function VM.new()\n';
            result += '    local self = setmetatable({R={}, PC=1, BC={}, CP={}, SP={}}, VM)\n';
            result += '    return self\n';
            result += 'end\n\n';
            
            // Генерация случайных опкодов
            let ops = [];
            for(let i=0;i<20;i++){
                ops.push(rand(1000, 99999));
            }
            
            result += 'function VM:execute(BC, CP, SP)\n';
            result += '    self.BC = BC\n';
            result += '    self.CP = CP\n';
            result += '    self.SP = SP\n';
            result += '    self.PC = 1\n';
            result += '    self.R = {}\n';
            result += '    while self.PC <= #self.BC do\n';
            result += '        local instr = self.BC[self.PC]\n';
            result += '        local op = (instr >> 24) & 255\n';
            result += '        local a = (instr >> 16) & 255\n';
            result += '        local b = (instr >> 8) & 255\n';
            result += '        local c = instr & 255\n';
            result += '        self.PC = self.PC + 1\n';
            result += '        if op == ' + ops[0] + ' then self.R[a] = self.R[b]\n';
            result += '        elseif op == ' + ops[1] + ' then self.R[a] = self.CP[b]\n';
            result += '        elseif op == ' + ops[2] + ' then self.R[a] = self.SP[b]\n';
            result += '        elseif op == ' + ops[3] + ' then self.R[a] = self.R[b] + self.R[c]\n';
            result += '        elseif op == ' + ops[4] + ' then self.R[a] = self.R[b] .. self.R[c]\n';
            result += '        elseif op == ' + ops[5] + ' then self.PC = b\n';
            result += '        elseif op == ' + ops[6] + ' then if not self.R[a] then self.PC = b end\n';
            result += '        elseif op == ' + ops[7] + ' then if self.R[a] then self.PC = b end\n';
            result += '        elseif op == ' + ops[8] + ' then \n';
            result += '            local fn = self.R[a]\n';
            result += '            local args = {}\n';
            result += '            for i = 1, b do args[i] = self.R[a + i] end\n';
            result += '            local res = {fn(table.unpack(args))}\n';
            result += '            if c > 0 then for i = 1, c do self.R[a + i - 1] = res[i] end end\n';
            result += '        elseif op == ' + ops[9] + ' then self.R[a] = env[self.SP[b]]\n';
            result += '        elseif op == ' + ops[10] + ' then env[self.SP[b]] = self.R[a]\n';
            result += '        elseif op == ' + ops[11] + ' then self.R[a] = char(b)\n';
            result += '        elseif op == ' + ops[12] + ' then return self.R[a]\n';
            result += '        else self.R[a] = self.R[b]\n';
            result += '        end\n';
            result += '    end\n';
            result += '    return self.R[1]\n';
            result += 'end\n\n';
            
            // Байткод для print
            result += 'local vm = VM.new()\n\n';
            result += 'local BC = {}\n';
            result += 'local CP = {}\n';
            result += 'local SP = {}\n';
            result += 'SP[1] = char(' + rand(100,999) + ')..char(' + rand(100,999) + ')..char(' + rand(100,999) + ')..char(' + rand(100,999) + ')..char(' + rand(100,999) + ')\n';
            
            // Строка текста
            let textChars = [];
            for(let i=0; i<text.length; i++){
                textChars.push('char(' + rand(100,900) + ' ^ ' + rand(100,900) + ')');
            }
            result += 'CP[1] = ' + textChars.join(' .. ') + '\n';
            
            // Инструкции VM
            let printOp = ops[9];
            let loadOp = ops[1];
            let callOp = ops[8];
            let retOp = ops[12];
            
            result += 'BC[1] = (' + printOp + ' << 24) | (1 << 16) | (1 << 8)\n';
            result += 'BC[2] = (' + loadOp + ' << 24) | (2 << 16) | (1 << 8)\n';
            result += 'BC[3] = (' + callOp + ' << 24) | (1 << 16) | (1 << 8)\n';
            result += 'BC[4] = (' + retOp + ' << 24)\n';
            
            result += '\nvm:execute(BC, CP, SP)\n';
            
        } else {
            let lines = code.split('\n');
            for(let line of lines){
                result += line + '\n';
            }
        }
        result += 'end\n';
        result += 'main(...)';
        return result;
    }
    
    return result;
}

let timerInterval,isProcessing=false,startTime;

btn.onclick=function(){
const code=input.value.trim();
if(!code){setStatus('Вставь код!','error');return}
if(isProcessing)return;
isProcessing=true;btn.disabled=true;btn.textContent='⏳ ОБРАБОТКА...';
setStatus('Обфускация...','loading');
startTime=performance.now();clearInterval(timerInterval);timerInterval=setInterval(()=>{const e=(performance.now()-startTime)/1000;timerDisplay.textContent='⏱ '+e.toFixed(2)+'с'},50);
output.textContent='⏳ Обфускация...';
setTimeout(()=>{try{const level=parseInt(levelSelect.value);const res=obfuscate(code,level);output.textContent=res||'Пустой результат';setStatus('Готово!','success')}catch(err){output.textContent='❌ Ошибка: '+err.message;setStatus('Ошибка: '+err.message,'error')}
clearInterval(timerInterval);const e=(performance.now()-startTime)/1000;timerDisplay.textContent='⏱ '+e.toFixed(2)+'с';
isProcessing=false;btn.disabled=false;btn.textContent='🔒 OBFUSCATE'},300);
};
</script>
</body>
</html>
